<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея - Блог о моей собаке</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="furry-bg"></div>
    
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="gallery.html" class="nav-link active">Галерея</a>
        </nav>
        <button class="admin-btn" onclick="openLoginModal()">Админ</button>
    </header>

    <main class="main">
        <section class="gallery-full">
            <h1 class="page-title">Моя галерея</h1>
            <p class="page-subtitle">Все мои лучшие фотографии</p>
            
            <div class="photo-grid-large">
                <div class="photo-item-large" data-photo="1">
                    <img src="../images/photo1.jpg" alt="Фото 1">
                </div>
                <div class="photo-item-large" data-photo="2">
                    <img src="../images/photo2.jpg" alt="Фото 2">
                </div>
                <div class="photo-item-large" data-photo="3">
                    <img src="../images/photo3.jpg" alt="Фото 3">
                </div>
                <div class="photo-item-large" data-photo="4">
                    <img src="../images/photo4.jpg" alt="Фото 4">
                </div>
                <div class="photo-item-large" data-photo="5">
                    <img src="../images/photo5.jpg" alt="Фото 5">
                </div>
                <div class="photo-item-large" data-photo="6">
                    <img src="../images/photo6.jpg" alt="Фото 6">
                </div>
                <div class="photo-item-large" data-photo="7">
                    <img src="../images/photo7.jpg" alt="Фото 7">
                </div>
                <div class="photo-item-large" data-photo="8">
                    <img src="../images/photo8.jpg" alt="Фото 8">
                </div>
            </div>
        </section>
    </main>

    <!-- Модальное окно -->
    <div class="modal" id="photoModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <img src="" alt="" class="modal-image" id="modalImage">
            <div class="modal-text" id="modalText"></div>
        </div>
    </div>

    <!-- Модальное окно входа -->
    <div class="modal" id="loginModal">
        <div class="modal-content login-modal">
            <span class="modal-close" onclick="closeLoginModal()">&times;</span>
            <h2>Вход в админ-панель</h2>
            <input type="text" id="loginUsername" placeholder="Логин" class="login-input">
            <input type="password" id="loginPassword" placeholder="Пароль" class="login-input">
            <button class="add-btn" onclick="checkLogin()">Войти</button>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Блог Алтая. Все права защищены лапками.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
